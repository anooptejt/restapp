name: Build restapp
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
env:
  ARTIFACT_ID: restapp
  VERSION: 0.1.0
  GROUP_ID: org.springframework
jobs:
  build:
    name: Maven Build
    if: "vars.ACTIVE_CLOUD == 'aws'"
    runs-on: aws-self-hosted-40415397
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: "${{ steps.login-ecr.outputs.registry }}"
          ECR_REPOSITORY: restapp-dev
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_number }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.run_number }}
  deploy:
    name: Deploy to ECS
    if: "vars.ACTIVE_CLOUD == 'aws'"
    needs: build
    runs-on: aws-self-hosted-40415397
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Force new deployment on ECS service
        run: aws ecs update-service --cluster "restapp-dev-cluster" --service "restapp-dev-service" --force-new-deployment --region us-east-1
